@if(Favoritos.length === 0){
  <div class="no-favoritos">
    <p>No hay ningún producto favorito aún. ❤️</p>
  </div>
}@else{
  <h3 class="titulo-seccion">Tus favoritos</h3>
  
  <div class="contenedor-cartas">
    @for(p of Favoritos; track p.id){
      <div class="carta">
        <div class="imagen-contenedor">
          <img src="assets/{{p.imagen}}" alt="{{p.nombre}}">
        </div>
        <div class="contenido-carta">
          <h2>{{p.nombre}}</h2>
          <button class="btn-aniadircarrito" (click)="aniadiralcarrito(p)">Añadir al carrito</button>
          <button class="btn-eliminar" (click)="eliminarFav(p.id)" title="Eliminar de favoritos">
            🚮 Eliminar
          </button>
        </div>
      </div>
    }
  </div>
}
