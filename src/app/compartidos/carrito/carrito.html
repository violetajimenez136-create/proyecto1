
@if(productosCarrito.length === 0){
  <p>el carrito esta vacio</p>
}@else{
  <table class="table">                                                                                
  <thead>
    <tr>
      <th scope="col">producto</th>
      <th scope="col">precio</th>
      <th scope="col">cantidad</th>
      <th scope="col">total</th>
     <th scope="col">eliminar producto</th>
      <th scope="col">realizar pago</th>
      <th><button (click)="vaciarCarrito()">vaciar carrito</button></th>
    </tr>
  </thead>
  <tbody>
    @for(p of productosCarrito; track p.id){
    <tr>
      <th><img src="assets/{{p.imagen}}"></th>
      <th scope="row">{{p.nombre}}</th>
      <td> <button type="button" (click)="disminuirCantidad(p.id)">-</button></td>
      <td>{{p.cantidad}}</td>
      <td> <button type="button" (click)="aumentarCantidad(p.id)">+</button></td>
      <td><button (click)="eliminarProducto(p.id)">🚮</button></td>
      <td><button>realizar pago</button></td>
    </tr>
  }
</tbody>
</table>
}
